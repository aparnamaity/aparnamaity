<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-label="per aspera ad astra">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1b1140"/>
      <stop offset="0.5" stop-color="#4a2a82"/>
      <stop offset="1" stop-color="#b86fc4"/>
    </linearGradient>
    <radialGradient id="neb1" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#d98be8" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#d98be8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="neb2" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#7a5be0" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#7a5be0" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="neb3" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffc9ec" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#ffc9ec" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="arc" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#ffe9fb" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <style>
      .tw { animation: tw 3s ease-in-out infinite; }
      .tw2 { animation: tw 4.4s ease-in-out infinite; }
      @keyframes tw { 0%,100% { opacity: .25 } 50% { opacity: 1 } }
    </style>
  </defs>

  <rect width="1200" height="300" fill="url(#sky)"/>


    <circle class="tw2" cx="330" cy="262" r="1.3"/>
    <circle class="tw" cx="1120" cy="262" r="1.6"/>
  </g>

  <g fill="#ffe9a8">
    <path class="tw2" d="M135 70 l3 9 9 3 -9 3 -3 9 -3 -9 -9 -3 9 -3z"/>
    <path class="tw" d="M1060 196 l3 9 9 3 -9 3 -3 9 -3 -9 -9 -3 9 -3z"/>

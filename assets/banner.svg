<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="100%" height="auto">
  <defs>
    <!-- Pastel Purple/Pink Gradient matching PennyPetal flower illustration colors (#A68BEA -> #E57AAB -> #FFD6E8) -->
    <linearGradient id="pastelGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A68BEA" />
      <stop offset="48%" stop-color="#E57AAB" />
      <stop offset="100%" stop-color="#FFD6E8" />
    </linearGradient>

    <!-- Subtle soft light auras for depth -->
    <radialGradient id="softAura1" cx="20%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#E6D9FF" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#A68BEA" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="softAura2" cx="80%" cy="70%" r="60%">
      <stop offset="0%" stop-color="#FFF0F5" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#FFD6E8" stop-opacity="0" />
    </radialGradient>

    <clipPath id="roundedCorners">
      <rect width="1200" height="300" rx="20" ry="20" />
    </clipPath>
  </defs>

  <!-- Banner Outer Rounded Container -->
  <g clip-path="url(#roundedCorners)">
    <rect width="1200" height="300" fill="url(#pastelGrad)" />
    <rect width="1200" height="300" fill="url(#softAura1)" />
    <rect width="1200" height="300" fill="url(#softAura2)" />

    <!-- Centered Elegant Italic Serif Text -->
    <text x="600" y="152" 
          font-family="Georgia, 'Times New Roman', serif" 
          font-style="italic" 
          font-size="46" 
          font-weight="500"
          fill="#2D1538" 
          letter-spacing="6" 
          text-anchor="middle" 
          dominant-baseline="central">per aspera ad astra</text>
  </g>

  <!-- Subtle refined inner border -->
  <rect x="1" y="1" width="1198" height="298" rx="19" fill="none" stroke="#2D1538" stroke-opacity="0.12" stroke-width="1.5" />
</svg>

  <text x="600" y="162" text-anchor="middle" font-family="'Brightwall', 'Segoe Script', 'Brush Script MT', 'Lucida Handwriting', 'Apple Chancery', cursive" font-size="34" letter-spacing="2" fill="#fff4fb">per aspera ad astra</text>

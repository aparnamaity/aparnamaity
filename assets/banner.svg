<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 280" width="100%" height="auto">
  <defs>
    <linearGradient id="bannerBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#361C42" />
      <stop offset="50%" stop-color="#4A2C5A" />
      <stop offset="100%" stop-color="#2D1538" />
    </linearGradient>
    <linearGradient id="coinGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCE195" />
      <stop offset="100%" stop-color="#F9C74F" />
    </linearGradient>
    <linearGradient id="pinkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE4F0" />
      <stop offset="100%" stop-color="#FFD6E8" />
    </linearGradient>
  </defs>

  <!-- Banner Outer Rounded Container -->
  <rect width="1000" height="280" rx="24" fill="url(#bannerBg)" />
  <rect x="1.5" y="1.5" width="997" height="277" rx="22.5" fill="none" stroke="#E6D9FF" stroke-opacity="0.2" stroke-width="2" />

  <!-- Background Decorative Pastel Clouds / Soft Blobs -->
  <circle cx="120" cy="60" r="140" fill="#E6D9FF" opacity="0.06" />
  <circle cx="880" cy="220" r="160" fill="#FFD6E8" opacity="0.07" />
  <circle cx="500" cy="140" r="220" fill="#D4F5E9" opacity="0.04" />

  <!-- Left Side: Flower & Coin Motif -->
  <g transform="translate(140, 140)">
    <!-- Outer Glow Petals -->
    <g opacity="0.95">
      <ellipse cx="0" cy="-44" rx="26" ry="42" fill="#E57AAB" />
      <ellipse cx="0" cy="-44" rx="26" ry="42" fill="#A68BEA" transform="rotate(60)" />
      <ellipse cx="0" cy="-44" rx="26" ry="42" fill="#FFD6E8" transform="rotate(120)" />
      <ellipse cx="0" cy="-44" rx="26" ry="42" fill="#A68BEA" transform="rotate(180)" />
      <ellipse cx="0" cy="-44" rx="26" ry="42" fill="#E57AAB" transform="rotate(240)" />
      <ellipse cx="0" cy="-44" rx="26" ry="42" fill="#FFD6E8" transform="rotate(300)" />
    </g>
    <!-- Center Golden Coin -->
    <circle cx="0" cy="0" r="32" fill="url(#coinGrad)" stroke="#E0A526" stroke-width="3.5" />
    <circle cx="0" cy="0" r="26" fill="none" stroke="#E0A526" stroke-width="1.5" />
    <text x="0" y="2" font-family="'Poppins', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="700" fill="#4A2C5A" text-anchor="middle" dominant-baseline="central">₹</text>
  </g>

  <!-- Left Floating Small Elements -->
  <circle cx="260" cy="70" r="6" fill="#F9C74F" opacity="0.8" />
  <path d="M 285 105 L 288 115 L 298 118 L 288 121 L 285 131 L 282 121 L 272 118 L 282 115 Z" fill="#FFE4F0" opacity="0.85" />
  <circle cx="70" cy="210" r="5" fill="#A68BEA" opacity="0.75" />
  <circle cx="230" cy="205" r="9" fill="#FFD6E8" opacity="0.5" />

  <!-- Center Typography & Motifs -->
  <g text-anchor="middle">
    <!-- Top badge -->
    <rect x="410" y="44" width="180" height="28" rx="14" fill="#FFD6E8" opacity="0.18" stroke="#FFD6E8" stroke-opacity="0.35" stroke-width="1" />
    <text x="500" y="62" font-family="'Poppins', -apple-system, sans-serif" font-size="12" font-weight="600" fill="#FFD6E8" letter-spacing="2">PORTFOLIO</text>

    <!-- Main Title -->
    <text x="500" y="126" font-family="'Poppins', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="44" font-weight="700" fill="#FFFFFF" letter-spacing="-0.5">Aparna Maity</text>
    
    <!-- Subtitle -->
    <text x="500" y="166" font-family="'Poppins', -apple-system, sans-serif" font-size="16" font-weight="400" fill="#E6D9FF" opacity="0.95" letter-spacing="0.5">Building thoughtful, modern software with Python &amp; FastAPI</text>

    <!-- Small Sparkles near text -->
    <path d="M 335 110 L 338 117 L 345 120 L 338 123 L 335 130 L 332 123 L 325 120 L 332 117 Z" fill="#F9C74F" opacity="0.9" />
    <path d="M 665 110 L 668 117 L 675 120 L 668 123 L 665 130 L 662 123 L 655 120 L 662 117 Z" fill="#F9C74F" opacity="0.9" />

    <!-- Bottom tags line -->
    <g transform="translate(500, 210)" font-family="'Poppins', sans-serif" font-size="12.5" font-weight="500">
      <text x="-160" y="0" fill="#FFD6E8">✦ AI &amp; Machine Learning</text>
      <text x="0" y="0" fill="#E6D9FF">✦ Backend Engineering</text>
      <text x="160" y="0" fill="#D4F5E9">✦ Aesthetic Fintech</text>
    </g>
  </g>

  <!-- Right Side: Secondary Blooming Floral & Golden Coin Cluster -->
  <g transform="translate(860, 140)">
    <!-- Flower Petals -->
    <g opacity="0.95">
      <ellipse cx="0" cy="-40" rx="23" ry="38" fill="#A68BEA" />
      <ellipse cx="0" cy="-40" rx="23" ry="38" fill="#E57AAB" transform="rotate(60)" />
      <ellipse cx="0" cy="-40" rx="23" ry="38" fill="#FFD6E8" transform="rotate(120)" />
      <ellipse cx="0" cy="-40" rx="23" ry="38" fill="#A68BEA" transform="rotate(180)" />
      <ellipse cx="0" cy="-40" rx="23" ry="38" fill="#E57AAB" transform="rotate(240)" />
      <ellipse cx="0" cy="-40" rx="23" ry="38" fill="#FFD6E8" transform="rotate(300)" />
    </g>
    <!-- Coin Disc -->
    <circle cx="0" cy="0" r="28" fill="url(#coinGrad)" stroke="#E0A526" stroke-width="3" />
    <circle cx="0" cy="0" r="22" fill="none" stroke="#E0A526" stroke-width="1.2" />
    <text x="0" y="2" font-family="'Poppins', -apple-system, sans-serif" font-size="24" font-weight="700" fill="#4A2C5A" text-anchor="middle" dominant-baseline="central">₹</text>
  </g>

  <!-- Right Floating Elements -->
  <path d="M 725 65 L 728 73 L 736 76 L 728 79 L 725 87 L 722 79 L 714 76 L 722 73 Z" fill="#FFD6E8" opacity="0.85" />
  <circle cx="750" cy="180" r="5" fill="#F9C74F" opacity="0.8" />
  <circle cx="940" cy="70" r="7" fill="#E6D9FF" opacity="0.6" />
</svg>

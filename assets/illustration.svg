<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 420" width="100%" height="auto">
  <defs>
    <linearGradient id="nightSky" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2D1538" />
      <stop offset="60%" stop-color="#4A2C5A" />
      <stop offset="100%" stop-color="#361B42" />
    </linearGradient>
    <linearGradient id="goldGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF2B2" />
      <stop offset="100%" stop-color="#F9C74F" />
    </linearGradient>
    <linearGradient id="petalGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD6E8" />
      <stop offset="100%" stop-color="#E57AAB" />
    </linearGradient>
  </defs>

  <!-- Card Background -->
  <rect width="320" height="420" rx="20" fill="url(#nightSky)" />
  <rect x="1.5" y="1.5" width="317" height="417" rx="18.5" fill="none" stroke="#E6D9FF" stroke-opacity="0.22" stroke-width="2" />

  <!-- Background Soft Aura -->
  <circle cx="160" cy="180" r="110" fill="#E6D9FF" opacity="0.08" />
  <circle cx="80" cy="320" r="90" fill="#FFD6E8" opacity="0.07" />

  <!-- Night Sky Stars & Sparkles -->
  <g fill="#FFF" opacity="0.85">
    <!-- Star 1 -->
    <path d="M 60 50 L 62 58 L 70 60 L 62 62 L 60 70 L 58 62 L 50 60 L 58 58 Z" fill="#F9C74F" />
    <!-- Star 2 -->
    <path d="M 260 70 L 261.5 76 L 267.5 77.5 L 261.5 79 L 260 85 L 258.5 79 L 252.5 77.5 L 258.5 76 Z" fill="#FFD6E8" />
    <!-- Star 3 -->
    <path d="M 120 110 L 121 114 L 125 115 L 121 116 L 120 120 L 119 116 L 115 115 L 119 114 Z" fill="#E6D9FF" />
    <!-- Star 4 -->
    <path d="M 235 240 L 236.5 244.5 L 241 246 L 236.5 247.5 L 235 252 L 233.5 247.5 L 229 246 L 233.5 244.5 Z" fill="#F9C74F" />
    <!-- Dots / Stardust -->
    <circle cx="95" cy="85" r="2" fill="#FFE5D9" />
    <circle cx="180" cy="45" r="2.5" fill="#FFF" />
    <circle cx="210" cy="100" r="1.5" fill="#E6D9FF" />
    <circle cx="45" cy="160" r="2" fill="#FFD6E8" />
    <circle cx="275" cy="165" r="2" fill="#F9C74F" />
    <circle cx="55" cy="270" r="2.5" fill="#E6D9FF" />
    <circle cx="280" cy="310" r="1.5" fill="#FFE5D9" />
  </g>

  <!-- Glowing Crescent Moon -->
  <g transform="translate(220, 75)">
    <path d="M 0 -28 A 28 28 0 1 0 28 0 A 22 22 0 1 1 0 -28 Z" fill="url(#goldGlow)" />
    <!-- Tiny sparkle inside moon curve -->
    <circle cx="8" cy="-8" r="3" fill="#FFF" opacity="0.9" />
  </g>

  <!-- Central Floral & Coin Composition -->
  <g transform="translate(160, 205)">
    <!-- Flower Petals Cluster -->
    <g>
      <!-- Base Petals Layer -->
      <ellipse cx="0" cy="-48" rx="28" ry="46" fill="#E57AAB" opacity="0.95" />
      <ellipse cx="0" cy="-48" rx="28" ry="46" fill="#A68BEA" opacity="0.95" transform="rotate(60)" />
      <ellipse cx="0" cy="-48" rx="28" ry="46" fill="#FFD6E8" opacity="0.95" transform="rotate(120)" />
      <ellipse cx="0" cy="-48" rx="28" ry="46" fill="#A68BEA" opacity="0.95" transform="rotate(180)" />
      <ellipse cx="0" cy="-48" rx="28" ry="46" fill="#E57AAB" opacity="0.95" transform="rotate(240)" />
      <ellipse cx="0" cy="-48" rx="28" ry="46" fill="#FFD6E8" opacity="0.95" transform="rotate(300)" />
    </g>

    <!-- Golden Coin Center -->
    <circle cx="0" cy="0" r="34" fill="url(#goldGlow)" stroke="#E0A526" stroke-width="3.5" />
    <circle cx="0" cy="0" r="27.5" fill="none" stroke="#E0A526" stroke-width="1.5" />
    <text x="0" y="2" font-family="'Poppins', -apple-system, sans-serif" font-size="30" font-weight="700" fill="#4A2C5A" text-anchor="middle" dominant-baseline="central">₹</text>
  </g>

  <!-- Botanical Vines & Leaves at Bottom -->
  <g stroke="#D4F5E9" stroke-width="2.5" fill="none" stroke-linecap="round" opacity="0.85">
    <path d="M 160 250 Q 160 320 110 360" />
    <path d="M 160 270 Q 185 310 220 340" />
  </g>
  <!-- Leaves -->
  <path d="M 125 315 C 110 305 105 295 120 290 C 135 295 135 310 125 315 Z" fill="#D4F5E9" opacity="0.8" />
  <path d="M 185 300 C 200 290 205 280 190 275 C 175 280 175 295 185 300 Z" fill="#B8F2E6" opacity="0.8" />
  <path d="M 215 335 C 230 330 235 320 220 315 C 205 320 205 330 215 335 Z" fill="#D4F5E9" opacity="0.8" />

  <!-- Code/Tech Accent Elements in Soft Lavender -->
  <g font-family="'Courier New', monospace" font-size="13" font-weight="bold" fill="#E6D9FF" opacity="0.75">
    <text x="40" y="380">&lt;code&gt;</text>
    <text x="220" y="380">&lt;/code&gt;</text>
  </g>

  <!-- Soft Ribbon Badge at Bottom Center -->
  <g transform="translate(160, 375)">
    <rect x="-65" y="-12" width="130" height="24" rx="12" fill="#FFD6E8" opacity="0.18" stroke="#FFD6E8" stroke-opacity="0.3" stroke-width="1" />
    <text x="0" y="3" font-family="'Poppins', sans-serif" font-size="10.5" font-weight="600" fill="#FFD6E8" text-anchor="middle" dominant-baseline="central" letter-spacing="1">FASTAPI &amp; PYTHON</text>
  </g>
</svg>
